name: Publish CV and resume PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-documents
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended
      - name: Compile both documents
        shell: bash
        run: |
          build_dir="$RUNNER_TEMP/latex"
          pdf_dir="$RUNNER_TEMP/documents"
          mkdir -p "$build_dir" "$pdf_dir"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export FORCE_SOURCE_DATE=1
          for source in CV_Shubha Resume_Shubha; do
            for pass in 1 2; do
              pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error \
                -file-line-error -output-directory="$build_dir" "$source.tex"
            done
          done
          cp "$build_dir/CV_Shubha.pdf" "$pdf_dir/Curriculum_Vitae_Syed_Emad_Uddin_Shubha.pdf"
          cp "$build_dir/Resume_Shubha.pdf" "$pdf_dir/Resume_Syed_Emad_Uddin_Shubha.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: documents
          path: ${{ runner.temp }}/documents/*.pdf
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: documents
          path: documents
      - name: Publish the PDF pair as the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is already on main."
            exit 0
          fi
          tag="documents-${GITHUB_SHA:0:12}"
          cv="Curriculum_Vitae_Syed_Emad_Uddin_Shubha.pdf"
          resume="Resume_Syed_Emad_Uddin_Shubha.pdf"
          test -s "documents/$cv"
          test -s "documents/$resume"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This commit already has a release."
          else
            gh release create "$tag" "documents/$cv" "documents/$resume" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "CV and résumé (${GITHUB_SHA:0:7})" --notes "Built from commit $GITHUB_SHA."
          fi
